spring.application.name=fintrack

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Encryption
encryption.data.algorithm=${ENCRYPTION_ALGORITHM}
encryption.data.tag-length-bits=${ENCRYPTION_TAG_LENGTH_BITS}
encryption.data.iv-length-bytes=${ENCRYPTION_IV_LENGTH_BYTES}
encryption.data.secret-key=${ENCRYPTION_SECRET_KEY}